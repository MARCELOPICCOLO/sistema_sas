# Credenciais do banco: defina DB_DATABASE, DB_USERNAME, DB_PASSWORD e
# DB_ROOT_PASSWORD em um arquivo .env na raiz (veja .env.example).
# Elas sobrescrevem as do backend/.env dentro do container.

services:
  # ============================
  # Aplicação Laravel (PHP-FPM)
  # ============================
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-restaurante}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend:/var/www
    networks:
      - restaurante_network
    depends_on:
      db:
        condition: service_healthy

  # ============================
  # Nginx (servidor web do backend)
  # ============================
  nginx:
    image: nginx:alpine
    container_name: restaurante_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - restaurante_network
    depends_on:
      - app

  # ============================
  # MySQL
  # ============================
  db:
    image: mysql:8.0
    container_name: restaurante_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-restaurante}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306" # 3307 no host para não conflitar com MySQL local
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - restaurante_network

  # ============================
  # Frontend React (build Vite servido pelo Nginx)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: restaurante_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - restaurante_network
    depends_on:
      - nginx

networks:
  restaurante_network:
    driver: bridge

volumes:
  dbdata:
