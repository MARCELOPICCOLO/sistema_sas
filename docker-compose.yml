services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    container_name: projeto-backend

    restart: unless-stopped

    working_dir: /var/www

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/var/www

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - projeto-network

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile

    container_name: projeto-nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www:ro

    depends_on:
      - backend

    networks:
      - projeto-network

  mysql:
    image: mysql:8.0

    container_name: projeto-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - projeto-network

networks:
  projeto-network:
    driver: bridge

volumes:
  mysql_data:
